name: build wine 11 gptk runtime

on:
  workflow_dispatch:
    inputs:
      opt:
        description: "standard -O2, release -O3, release-lto -O3+thinLTO (known broken), fast -O0"
        type: choice
        default: standard
        options: [standard, release, release-lto, fast]
      runner:
        description: "where to build: self-hosted is ~10x faster, hosted is the clean-room check"
        type: choice
        default: self-hosted
        options: [self-hosted, hosted]
      gui_gate:
        description: "run the window-open gate in CI (graphics is verified locally now)"
        type: boolean
        default: false
  push:
    branches: [main]

env:
  WINE_TAG: wine-11.14
  DXVK_VERSION: "1.10.3"
  DXMT_VERSION: "0.80"

jobs:
  build:
    runs-on: ${{ inputs.runner == 'hosted' && fromJSON('["macos-15"]') || fromJSON('["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7.0.1

      - name: ensure rosetta
        run: |
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/true && echo "rosetta ok"

      # the self-hosted runner is nix-darwin managed and already carries
      # extra-platforms = x86_64-darwin; installing over it would clobber a
      # real machine's daemon and store
      - name: install nix
        if: inputs.runner == 'hosted'
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            extra-platforms = x86_64-darwin

      - name: clone wine
        run: |
          git clone --depth 1 --branch "$WINE_TAG" https://gitlab.winehq.org/wine/wine.git winecx
          git -C winecx log -1 --oneline

      - name: apply patches
        run: |
          for p in "$PWD"/patches/*.patch; do
            echo "applying $(basename "$p")"
            git -C winecx apply --verbose "$p"
          done

      # compilation cache: harness-only changes rebuild in minutes instead of
      # ~50. compilercheck=content so the cache survives runner image updates;
      # a cold cache is still a full clean build, which is the right mode for
      # a release artifact.
      - name: ccache
        run: |
          # a self-hosted runner is a real machine, and this one is nix-darwin
          # managed with brew cleanup=uninstall, which reaps imperative
          # installs. use what is already there and only install if missing
          command -v ccache >/dev/null || brew install -q ccache
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            # two PE arches plus the unix half is ~10k objects
            echo "CCACHE_MAXSIZE=4G"
            echo "CCACHE_COMPILERCHECK=content"
            # wine stamps __DATE__/__TIME__ into a few files and every run gets
            # a fresh checkout, so without these the hit rate collapses on
            # exactly the files that never changed
            echo "CCACHE_SLOPPINESS=time_macros,locale,include_file_mtime,include_file_ctime"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=1"
            # apfs clones instead of byte copies on a hit. not hardlinks: the
            # package step strips outputs in place and would rewrite the cache
            echo "CCACHE_FILECLONE=1"
            echo "CCACHE_INODECACHE=1"
          } >> "$GITHUB_ENV"

      # only on hosted runners. the self-hosted runner keeps its ccache on a
      # local volume across runs, so round-tripping gigabytes to github's cache
      # service just to overwrite an already-correct cache is pure latency --
      # measured 2026-08-05, it stalled a build for minutes at a trickle.
      - name: restore compiler cache
        if: inputs.runner == 'hosted'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.WINE_TAG }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.WINE_TAG }}-
            ccache-

      # gcc, not llvm-mingw. measured 2026-08-04: with a kernelbase.dll built
      # by llvm-mingw, steam never completes its CM login -- it loops
      # "EConnect called - scheduling connection for 50ms from now" forever.
      # swapping in a gcc-built kernelbase.dll and changing nothing else makes
      # it log in within 30s, and swapping it back reproduces the stall. every
      # other module of ours is fine, including ntdll and the whole i386 half.
      # cause inside kernelbase is still unknown: not a missing export, not
      # QueryDosDeviceW codegen, not -fno-strict-aliasing, not the -O level
      # (-O1 fails too), and not the SEH tables. see frankea-base-recipe.md.
      - name: mingw-w64 gcc for the PE half
        run: |
          command -v x86_64-w64-mingw32-gcc >/dev/null || brew install -q mingw-w64
          x86_64-w64-mingw32-gcc --version | head -1
          i686-w64-mingw32-gcc --version | head -1
          # wrappers so the PE half goes through ccache as well; brew's gcc is
          # not something ccache picks up by itself
          mkdir -p ccache-bin
          for t in x86_64-w64-mingw32-gcc i686-w64-mingw32-gcc; do
            # resolve the real binary NOW and bake the absolute path in. doing
            # the lookup inside the wrapper instead recurses forever, because
            # by then ccache-bin is first on PATH and `command -v` finds the
            # wrapper itself: configure hung for three hours on exactly that.
            real=$(command -v "$t") || { echo "::error::$t not found"; exit 1; }
            printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$real" > "ccache-bin/$t"
            chmod +x "ccache-bin/$t"
          done
          # prove the wrapper terminates before anything depends on it
          PATH="$PWD/ccache-bin:$PATH" x86_64-w64-mingw32-gcc --version >/dev/null
          PATH="$PWD/ccache-bin:$PATH" i686-w64-mingw32-gcc --version >/dev/null
          echo "ccache wrappers ok"

      - name: nix toolchain and x86_64 libs
        run: |
          NIXPKGS="github:NixOS/nixpkgs/nixos-25.05"
          tools=$(nix build --no-link --print-out-paths \
            "$NIXPKGS#bison" "$NIXPKGS#flex" "$NIXPKGS#pkg-config")
          toolpath=""
          for t in $tools; do toolpath="$t/bin:$toolpath"; done
          echo "NIX_TOOL_PATH=$toolpath" >> "$GITHUB_ENV"

          outs=""
          for p in freetype gnutls libpng zlib brotli bzip2 nettle libtasn1 libidn2 p11-kit libunistring gmp moltenvk vulkan-headers; do
            for o in dev out; do
              if path=$(nix build --no-link --print-out-paths \
                "$NIXPKGS#legacyPackages.x86_64-darwin.$p.$o" 2>/dev/null); then
                outs="$outs $path"
              fi
            done
          done
          echo "$outs" | tr ' ' '\n' | grep . > store-outs.txt
          pcp=""
          incs=""
          ldfs=""
          for d in $outs; do
            [ -d "$d/lib/pkgconfig" ] && pcp="$d/lib/pkgconfig:$pcp"
            [ -d "$d/include" ] && incs="$incs -I$d/include"
            [ -d "$d/lib" ] && ldfs="$ldfs -L$d/lib"
          done
          {
            echo "NIX_PKG_CONFIG_PATH=$pcp"
            echo "NIX_INCS=$incs"
            echo "NIX_LDFS=$ldfs"
          } >> "$GITHUB_ENV"
          cat store-outs.txt

      # the host tools (makedep, winebuild, wrc, widl, wmc) get exec'd
      # thousands of times per build. built x86_64 they are all rosetta
      # processes, and macos 27.0's ecosystemanalyticsd grinds the whole
      # machine analyzing them (unbounded retry loop, it can never reach
      # com.apple.bird from the system domain, so every analysis requeues).
      # building them native and pointing the main configure at them keeps
      # rosetta out of the hot path; the only translated processes left per
      # run are the smoke test's. native freetype is needed because sfnt2fon
      # links it and the x86_64 nix libs above are the wrong arch here.
      - name: native tools build
        run: |
          NIXPKGS="github:NixOS/nixpkgs/nixos-25.05"
          outs=$(nix build --no-link --print-out-paths \
            "$NIXPKGS#freetype.dev" "$NIXPKGS#freetype.out" \
            "$NIXPKGS#libpng.dev" "$NIXPKGS#zlib.dev" \
            "$NIXPKGS#brotli.dev" "$NIXPKGS#bzip2.dev")
          pcp=""
          for d in $outs; do
            [ -d "$d/lib/pkgconfig" ] && pcp="$d/lib/pkgconfig:$pcp"
          done
          export PATH="$NIX_TOOL_PATH$PATH"
          export SDKROOT="$(/usr/bin/xcrun --show-sdk-path)"
          export CC="ccache /usr/bin/clang"
          export PKG_CONFIG_PATH="$pcp"
          mkdir build-tools && cd build-tools
          # --enable-archs=x86_64 is required, not cosmetic: wine 11 refuses to
          # configure without a PE cross-compiler for the HOST arch, and there
          # is no aarch64-w64-mingw32 here ("PE cross-compilation is required
          # for aarch64-apple-darwin"). naming x86_64 points it at the mingw we
          # do have. only __tooldeps__ is built from this tree, so no PE module
          # is ever produced by it.
          ../winecx/configure \
            --enable-archs=x86_64 \
            --without-x --without-wayland --without-gstreamer \
            --without-oss --without-alsa --without-pulse --without-sane \
            --without-usb --without-v4l2 --without-pcap --without-capi \
            --without-opencl --without-ffmpeg --without-cups \
            --disable-tests
          make -j"$(sysctl -n hw.ncpu)" __tooldeps__

      - name: wine-mono, wine-gecko and the graphics payloads
        run: |
          set -eu
          # the extracted form, which is what the stock whisky engine ships and
          # what mscoree and mshtml load straight out of the datadir. without
          # them a fresh prefix stops on a modal wine-mono dialog and waits
          # for a click, which is a hang with no error (measured 2026-08-04).
          mono_ver=$(sed -n 's/^#define MONO_VERSION "\(.*\)"/\1/p' winecx/dlls/appwiz.cpl/addons.c)
          gecko_ver=$(sed -n 's/^#define GECKO_VERSION "\(.*\)"/\1/p' winecx/dlls/appwiz.cpl/addons.c)
          [ "$mono_ver" = "11.2.0" ] && [ "$gecko_ver" = "2.47.4" ] || {
            echo "::error::wine now wants mono $mono_ver gecko $gecko_ver; update the pinned hashes"
            exit 1
          }

          fetch() {
            curl -fsSL -o "$2" "$1"
            got=$(shasum -a 256 "$2" | cut -d' ' -f1)
            [ "$got" = "$3" ] || { echo "::error::hash mismatch for $2: $got != $3"; exit 1; }
          }

          mkdir -p addons/mono addons/gecko payload
          fetch "https://dl.winehq.org/wine/wine-mono/$mono_ver/wine-mono-$mono_ver-x86.tar.xz" \
                mono.tar.xz c9fb2e2823acf30b000b8806177db0f40751786136dd3f8fb2be7897b1643d06
          fetch "https://dl.winehq.org/wine/wine-gecko/$gecko_ver/wine-gecko-$gecko_ver-x86.tar.xz" \
                gecko-x86.tar.xz 2cfc8d5c948602e21eff8a78613e1826f2d033df9672cace87fed56e8310afb6
          fetch "https://dl.winehq.org/wine/wine-gecko/$gecko_ver/wine-gecko-$gecko_ver-x86_64.tar.xz" \
                gecko-x64.tar.xz fd88fc7e537d058d7a8abf0c1ebc90c574892a466de86706a26d254710a82814
          tar -xJf mono.tar.xz -C addons/mono
          tar -xJf gecko-x86.tar.xz -C addons/gecko
          tar -xJf gecko-x64.tar.xz -C addons/gecko
          [ -d "addons/mono/wine-mono-$mono_ver" ] || { echo "::error::mono layout changed"; exit 1; }

          # a runtime with no d3d11 implementation cannot render chromium:
          # wined3d goes through apple's opengl, frozen at 4.1, which gives
          # ANGLE feature level 9_3 and a hard "GLES 3.0 > max supported 2.0".
          # measured on the first gcc artifact: steam logged in and painted
          # nothing. dxvk and dxmt are what make the ui appear.
          fetch "https://github.com/Gcenx/DXVK-macOS/releases/download/v$DXVK_VERSION-20230507-repack/dxvk-macOS-async-v$DXVK_VERSION-20230507-repack.tar.gz" \
                dxvk.tar.gz acd1520ad105d8ef124a09c8e11a259a5dc8bdc565ad18e0e52693f9807b2477
          fetch "https://github.com/3Shain/dxmt/releases/download/v$DXMT_VERSION/dxmt-v$DXMT_VERSION-builtin.tar.gz" \
                dxmt.tar.gz 8f260e36b5739e68f3bad613381441385c4dc7b85b78ba8de653d5a6a264529d
          tar -xzf dxvk.tar.gz -C payload
          tar -xzf dxmt.tar.gz -C payload
          ls payload

      - name: configure
        env:
          OPT_LEVEL: ${{ inputs.opt }}
        run: |
          export PATH="$PWD/ccache-bin:$NIX_TOOL_PATH$PATH"
          export SDKROOT="$(/usr/bin/xcrun --show-sdk-path)"
          export CC="ccache /usr/bin/clang -arch x86_64"
          export CXX="ccache /usr/bin/clang++ -arch x86_64"
          export PKG_CONFIG_PATH="$NIX_PKG_CONFIG_PATH"
          # -O2 unless asked otherwise: what wine itself ships and where a
          # push build should stay. -O3 is opt-in for runtimes we release,
          # -O0 for runs that only need to answer whether a patch works
          # thin LTO applies to the clang-built unix half only: the PE half is
          # mingw-w64 gcc, where -flto=thin is not a valid flag.  ar/ranlib must
          # understand llvm bitcode for this, hence the llvm- prefixed tools.
          LTO=""
          case "$OPT_LEVEL" in
            release) OPT="-O3" ;;
            release-lto)
              # clang segfaults compiling loader/main.o under -O3 -flto=thin
              # (frontend crash, not a wine problem), so this is not the
              # shipping setting.  kept to retry on a newer toolchain.
              OPT="-O3"
              LTO="-flto=thin"
              export AR=llvm-ar RANLIB=llvm-ranlib NM=llvm-nm
              ;;
            fast)
              OPT="-O0"
              echo "::warning::fast build, -O0; do not publish this artifact"
              ;;
            *) OPT="-O2" ;;
          esac
          echo "optimisation: $OPT${LTO:+ $LTO (unix half only)}" | tee -a "$GITHUB_STEP_SUMMARY"
          export CFLAGS="$OPT $LTO -Wno-error=implicit-function-declaration $NIX_INCS"
          # the PE half is built by mingw-w64 gcc and takes CROSSCFLAGS, which
          # otherwise defaults to "-g -O2"
          export CROSSCFLAGS="-g $OPT"
          export LDFLAGS="$LTO $NIX_LDFS"
          export ac_cv_lib_soname_freetype="libfreetype.6.dylib"
          export ac_cv_lib_soname_gnutls="libgnutls.30.dylib"
          # wine dlopens MoltenVK by soname; the bundled copy is found via
          # the loader fallback path whisky already sets for its runtime
          export ac_cv_lib_soname_MoltenVK="libMoltenVK.dylib"
          mkdir build && cd build
          ../winecx/configure \
            --host=x86_64-apple-darwin24 \
            --with-wine-tools=../build-tools \
            --enable-archs=i386,x86_64 \
            --disable-tests \
            --without-x --without-wayland --without-gstreamer \
            --without-oss --without-alsa --without-pulse --without-sane \
            --without-usb --without-v4l2 --without-pcap --without-capi \
            --without-opencl --without-ffmpeg --without-cups \
            --prefix=/opt/whiskywine || {
              echo "==== core tests section ===="
              sed -n '100,500p' config.log
              exit 1
            }

      - name: make
        run: |
          export PATH="$PWD/ccache-bin:$NIX_TOOL_PATH$PATH"
          cd build
          ncpu=$(sysctl -n hw.logicalcpu)
          ccache -z >/dev/null
          make -j"$(( ncpu + ncpu / 2 ))"
          {
            echo "### ccache"
            echo '```'
            ccache -s
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: install and package
        run: |
          export PATH="$PWD/ccache-bin:$NIX_TOOL_PATH$PATH"
          cd build
          # install-lib skips install-dev (headers and static libs we do not
          # ship). the expensive part is the import lib winebuild does per
          # dll, which install-lib still performs -- so the lever is
          # PARALLELISM: the make step runs -j15 while this ran single
          # threaded, which is what made packaging take longer than the build.
          make -j"$(( $(sysctl -n hw.logicalcpu) * 3 / 2 ))" install-lib DESTDIR="$PWD/../staging"
          cd ..
          mkdir -p Libraries/Wine
          # cp -c is an apfs clone: metadata only, no byte copy. fallback for
          # non-apfs filesystems
          cp -Rc staging/opt/whiskywine/bin Libraries/Wine/bin 2>/dev/null || cp -R staging/opt/whiskywine/bin Libraries/Wine/bin
          cp -Rc staging/opt/whiskywine/lib Libraries/Wine/lib 2>/dev/null || cp -R staging/opt/whiskywine/lib Libraries/Wine/lib
          cp -Rc staging/opt/whiskywine/share Libraries/Wine/share 2>/dev/null || cp -R staging/opt/whiskywine/share Libraries/Wine/share

          # the addons go in extracted, in the same place the stock engine
          # puts them, so mscoree and mshtml find them in the datadir and no
          # per-bottle copy is installed
          mkdir -p Libraries/Wine/share/wine/mono Libraries/Wine/share/wine/gecko
          cp -R addons/mono/* Libraries/Wine/share/wine/mono/
          cp -R addons/gecko/* Libraries/Wine/share/wine/gecko/

          # dxmt's wine-side half is ONLY the winemetal bridge. copying the whole
          # payload dir in here overwrote wine's builtin d3d11/dxgi with dxmt's,
          # which made every fresh prefix run dxmt silently -- and dxmt refuses
          # the cross-process swapchains steam's post-2026-08 webhelper creates
          # ("CreateSwapChain: cross-process swapchain not supported yet"), so
          # the login window never mapped. it also put nvapi64.dll in the
          # builtins, which must never be visible to the webhelper. the d3d
          # frontends stay per-bottle in Libraries/DXMT, deployed by whisky's
          # backend picker with explicit overrides.
          dxmt=payload/v$DXMT_VERSION
          cp -R "$dxmt/x86_64-unix/." Libraries/Wine/lib/wine/x86_64-unix/
          cp "$dxmt/x86_64-windows/winemetal.dll" Libraries/Wine/lib/wine/x86_64-windows/
          if [ -f "$dxmt/i386-windows/winemetal.dll" ]; then
            cp "$dxmt/i386-windows/winemetal.dll" Libraries/Wine/lib/wine/i386-windows/
          fi

          # and the per-bottle payloads whisky's backend picker offers
          dxvk=payload/dxvk-macOS-async-v$DXVK_VERSION-20230507-repack
          mkdir -p Libraries/DXVK Libraries/DXMT
          cp -R "$dxvk/." Libraries/DXVK/
          cp -R "$dxmt/x86_64-windows" Libraries/DXMT/x64
          cp -R "$dxmt/i386-windows" Libraries/DXMT/x32

          # dxmt only publishes the "builtin" flavour, whose d3d frontends carry
          # winebuild's "Wine builtin DLL" signature at 0x40. That marker is
          # right for the copies under lib/wine, but fatal for the per-bottle
          # ones: wine's loader ignores a builtin-marked dll placed in a prefix
          # and redirects to the real builtin, so the bottle silently runs
          # wined3d instead of dxmt. Whisky checks for exactly this and greys
          # dxmt out when it finds it (whisky issue #146). Restore the stock
          # MS-DOS stub over those 16 bytes. winemetal.dll is deliberately left
          # alone -- it really is a wine builtin.
          for arch in x64 x32; do
            for dll in d3d11.dll d3d10core.dll dxgi.dll; do
              f="Libraries/DXMT/$arch/$dll"
              [ -f "$f" ] || continue
              printf '\016\037\272\016\000\264\011\315\041\270\001\114\315\041\220\220' \
                | dd of="$f" bs=1 seek=64 conv=notrunc status=none
            done
          done

          # assert it took: a marker surviving here resurrects the silent
          # wined3d fallback this strip exists to prevent
          for f in Libraries/DXMT/x64/*.dll Libraries/DXMT/x32/*.dll; do
            case "$(basename "$f")" in winemetal.dll) continue ;; esac
            if dd if="$f" bs=1 skip=64 count=16 status=none | grep -q "Wine builtin DLL"; then
              echo "::error::$f still carries the wine builtin marker; whisky will refuse dxmt"
              exit 1
            fi
          done
          echo "dxmt frontends are markerless" | tee -a "$GITHUB_STEP_SUMMARY"

          # gcc emits debug info and nothing removes it: kernelbase.dll came
          # out at 7.6MB and the tarball at 557MB against the stock engine's
          # 332MB. one file per invocation, since a non-COFF entry would
          # otherwise take the rest of its batch down with it.
          find Libraries/Wine/lib/wine/*-windows -name '*.a' -delete
          # batched: gnu strip prints an error for a non-COFF file and keeps
          # going with the rest of the batch (verified 2026-08-05), so the
          # old one-file-per-spawn form burned ~10k process launches, each
          # taxed by the rosetta analytics daemons
          find Libraries/Wine/lib/wine/*-windows -type f -print0 \
            | xargs -0 -P "$(sysctl -n hw.logicalcpu)" -n 64 \
                x86_64-w64-mingw32-strip --strip-debug 2>/dev/null || true
          # CW HACK 22144: on apple without a preloader the loader expects its
          # own binary to be named wineloader; whisky expects wine64
          cp Libraries/Wine/bin/wine Libraries/Wine/bin/wineloader
          ln -s wine Libraries/Wine/bin/wine64

          # bundle the nix dylib closure flat into Wine/lib and rewrite
          # store references to loader-relative so the tarball is portable
          LIBDIR="$PWD/Libraries/Wine/lib"
          scan() { otool -L "$1" 2>/dev/null | awk '/\/nix\/store/{print $1}'; }

          queue=""
          for d in $(cat store-outs.txt); do
            for so in libfreetype.6.dylib libgnutls.30.dylib libMoltenVK.dylib; do
              [ -f "$d/lib/$so" ] && queue="$queue $d/lib/$so"
            done
          done
          while [ -n "$queue" ]; do
            next=""
            for lib in $queue; do
              base=$(basename "$lib")
              [ -e "$LIBDIR/$base" ] && continue
              cp -L "$lib" "$LIBDIR/$base"
              chmod u+w "$LIBDIR/$base"
              next="$next $(scan "$LIBDIR/$base" | tr '\n' ' ')"
            done
            queue=""
            for l in $next; do
              [ -e "$LIBDIR/$(basename "$l")" ] || queue="$queue $l"
            done
          done

          # two iconvs are needed, and they are not interchangeable: libintl
          # wants plain _iconv (only macOS's /usr/lib copy exports it) while
          # libidn2 and libunistring want GNU's _libiconv (only nix's copy has
          # it). so libintl is pointed at the system library and everything
          # else keeps the bundled one.
          fixup() {
            local f="$1"
            local rel
            rel=$(python3 -c "import os,sys; print(os.path.relpath(sys.argv[1], os.path.dirname(sys.argv[2])))" "$LIBDIR" "$f")
            chmod u+w "$f" 2>/dev/null || true
            # the id, not just the dependencies: a dylib that still calls
            # itself /nix/store/... cannot be dlopened off the builder, and
            # the only symptom is fonts, vulkan and tls quietly missing
            case "$f" in
              *.dylib) install_name_tool -id "@loader_path/$(basename "$f")" "$f" 2>/dev/null || true ;;
            esac
            for ref in $(scan "$f"); do
              if [[ "$(basename "$ref")" == libiconv*.dylib && "$(basename "$f")" == libintl* ]]; then
                install_name_tool -change "$ref" "/usr/lib/libiconv.2.dylib" "$f" 2>/dev/null || true
              else
                install_name_tool -change "$ref" "@loader_path/$rel/$(basename "$ref")" "$f" 2>/dev/null || true
              fi
            done
            codesign -f -s - "$f" 2>/dev/null || true
          }
          for f in "$LIBDIR"/*.dylib; do fixup "$f"; done
          find Libraries/Wine/bin -type f | while read -r f; do fixup "$f"; done
          find Libraries/Wine/lib/wine -name "*.so" | while read -r f; do fixup "$f"; done

          # the reference runtime ships both names
          ln -sf libfreetype.6.dylib "$LIBDIR/libfreetype.dylib"

          # the unix modules dlopen libgnutls/libfreetype/libMoltenVK by bare
          # soname, and dlopen searches the caller's rpaths. lib/wine/<arch>-unix
          # is two levels below the bundled dylibs, so without this entry none
          # of them resolve: no tls, no fonts, no vulkan.
          for f in Libraries/Wine/lib/wine/*-unix/*.so; do
            install_name_tool -add_rpath "@loader_path/../../" "$f" 2>/dev/null || true
            codesign -f -s - "$f" 2>/dev/null || true
          done

          cat > Libraries/WhiskyWineVersion.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>gptkCapable</key>
            <true/>
            <key>dxvkVersion</key>
            <string>DXVK_VER</string>
            <key>dxmtVersion</key>
            <string>DXMT_VER</string>
            <key>version</key>
            <dict>
              <key>major</key>
              <integer>4</integer>
              <key>minor</key>
              <integer>0</integer>
              <key>patch</key>
              <integer>0</integer>
            </dict>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/DXVK_VER/$DXVK_VERSION/; s/DXMT_VER/$DXMT_VERSION/" Libraries/WhiskyWineVersion.plist

          # gzip -3: the ci artifact gets zipped again by upload-artifact
          # anyway, and -9-grade compression here bought ~4 minutes for ~6%
          tar -cf - Libraries | gzip -3 > Libraries.tar.gz
          shasum -a 256 Libraries.tar.gz | tee Libraries.tar.gz.sha256

      - name: verify the tree is relocatable
        run: |
          set -o pipefail
          # a dylib whose own id is a /nix/store path exists only on the
          # builder, so it cannot be dlopened anywhere else, and the runtime
          # silently loses fonts, vulkan and tls with no error at all
          : > /tmp/badrefs
          scanned=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q Mach-O || continue
            scanned=$((scanned + 1))
            id=$(otool -D "$f" | sed -n '2p')
            printf '%s\n' "$id" | grep -E '^/' | grep -vE '^(/usr/lib/|/System/)' \
              | sed "s|^|id $f -> |" >> /tmp/badrefs || true
            otool -L "$f" | tail -n +2 | awk '{print $1}' \
              | { if [ -n "$id" ]; then grep -vFx "$id"; else cat; fi; } \
              | grep -E '^/' | grep -vE '^(/usr/lib/|/System/)' \
              | sed "s|^|dep $f -> |" >> /tmp/badrefs || true
            otool -l "$f" | awk '/cmd LC_RPATH/{r=1} r && /path /{print $2; r=0}' \
              | grep -E '^/' | grep -vE '^(/usr/lib/|/System/)' \
              | sed "s|^|rpath $f -> |" >> /tmp/badrefs || true
          done < <(find Libraries -type f ! -type l -print0)
          # a wine tree holds ~60 Mach-O files: the unix modules, the bundled
          # dylibs and the loaders. the PE half is COFF and is skipped, so a
          # floor in the thousands is wrong -- this is only here to catch a
          # sweep that scanned nothing because find or file broke.
          [ "$scanned" -gt 40 ] || {
            echo "::error::sweep scanned only $scanned Mach-O files; the scan broke"
            exit 1
          }
          if [ -s /tmp/badrefs ]; then
            sed 's/^/::error::not relocatable: /' /tmp/badrefs
            exit 1
          fi
          echo "relocatable: ok ($scanned Mach-O files)"

          # a 64-bit-only tree cannot load syswow64\ntdll.dll and every
          # 32-bit program dies with c0000135
          i386=$(ls Libraries/Wine/lib/wine/i386-windows 2>/dev/null | wc -l | tr -d ' ')
          [ "$i386" -gt 500 ] || { echo "::error::i386-windows has $i386 files"; exit 1; }
          echo "i386 PE half: $i386 files"

          for d in share/wine/mono share/wine/gecko; do
            [ -d "Libraries/Wine/$d" ] || { echo "::error::missing $d"; exit 1; }
          done
          # without a d3d11 implementation chromium cannot start a gl context
          [ -f Libraries/DXVK/x64/d3d11.dll ] || { echo "::error::no dxvk payload"; exit 1; }
          [ -f Libraries/Wine/lib/wine/x86_64-unix/winemetal.so ] || { echo "::error::no dxmt builtin"; exit 1; }
          # the builtin d3d must be wine's own: a dxmt-flavoured builtin hijacks
          # every prefix that has no explicit override and cannot serve steam's
          # cross-process webhelper swapchains
          for d in d3d11 dxgi d3d10core; do
            if strings "Libraries/Wine/lib/wine/x86_64-windows/$d.dll" 2>/dev/null | grep -q 'DXMT_\|dxmt\.con'; then
              echo "::error::builtin $d.dll is dxmt, not wine"; exit 1
            fi
          done
          if [ -f Libraries/Wine/lib/wine/x86_64-windows/nvapi64.dll ]; then
            echo "::error::nvapi64.dll leaked into the builtins"; exit 1
          fi
          echo "addons and graphics payloads: ok"

      # graphics verification moved local. it needs a real gui session and a
      # human eye for things a luma threshold cannot judge (resize flicker,
      # compositing artefacts); running it here only produced false confidence.
      # flip the gui_gate input to run it anyway.
      - name: verify the runtime can open a window
        if: inputs.gui_gate
        run: |
          # the gate above only inspects the tree. a display driver that fails
          # to init is invisible until something asks for a window: wine falls
          # back to nodrv, keeps going, and only CreateWindowEx says so.
          export PATH="$PWD/ccache-bin:$NIX_TOOL_PATH$PATH"
          x86_64-w64-mingw32-gcc -O2 -o winmsg.exe tests/winmsg.c -luser32
          i686-w64-mingw32-gcc -O2 -o winmsg32.exe tests/winmsg.c -luser32

          export WINEPREFIX="$PWD/smoke-prefix"
          export DYLD_FALLBACK_LIBRARY_PATH="$PWD/Libraries/Wine/lib"
          # mono and mshtml are disabled here so a fresh prefix cannot stop on
          # the addon dialog and hang the job
          export WINEDLLOVERRIDES="mscoree=d;mshtml=d"
          WINEDEBUG=-all ./Libraries/Wine/bin/wine64 wineboot -u >/dev/null 2>&1 || true

          WINEDEBUG=+winediag ./Libraries/Wine/bin/wine64 winmsg.exe > smoke.log 2>&1 || true
          WINEDEBUG=+winediag ./Libraries/Wine/bin/wine64 winmsg32.exe > smoke32.log 2>&1 || true
          grep -E '^\[|^RESULT' smoke.log | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E '^RESULT' smoke32.log | sed 's/^/wow64 /' | tee -a "$GITHUB_STEP_SUMMARY"

          if grep -q "nodrv_CreateWindow" smoke.log; then
            echo "::error::the display driver did not load; the runtime fell back to nodrv"
            sed -n 's/^.*winediag:/  /p' smoke.log | head -5
            exit 1
          fi
          grep -q "RESULT: windows ok" smoke.log || {
            echo "::error::the runtime cannot create a window"
            tail -20 smoke.log
            exit 1
          }
          grep -q "RESULT: windows ok" smoke32.log || {
            echo "::error::the 32-bit half cannot create a window"
            tail -20 smoke32.log
            exit 1
          }
          echo "windows: ok (64 and 32)"

      - name: upload runtime
        uses: actions/upload-artifact@v7.0.1
        with:
          name: whiskywine-gptk-libraries
          path: |
            Libraries.tar.gz
            Libraries.tar.gz.sha256
          retention-days: 14
